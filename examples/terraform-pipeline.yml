# Drop into .github/workflows/ of a Terraform repository to gate every PR.
name: terraform-compliance

on:
  pull_request:
    paths: ["**/*.tf"]

permissions:
  contents: read
  id-token: write          # OIDC login to Azure: no stored client secret
  security-events: write

jobs:
  plan-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: terraform init -input=false
      - run: terraform plan -input=false -out=plan.out
      - run: terraform show -json plan.out > plan.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install git+https://github.com/speakwithuche-create/tf-compliance-gate
      - name: Compliance gate
        run: tfgate scan plan.json --waivers .compliance/waivers.json --fail-on high --format sarif -o tfgate.sarif
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfgate.sarif
          category: tfgate
