name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - name: Lint (includes Bandit security rules via ruff "S")
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest --cov=tfgate --cov-fail-under=90

  demo-gate:
    # Shows the gate in action on the sample plan and publishes findings to
    # the repository's Security tab via SARIF.
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Scan sample plan (expected to fail; that's the point)
        id: scan
        continue-on-error: true
        run: tfgate scan examples/plan.json --waivers examples/waivers.json --format sarif -o results.sarif
      - name: Assert the gate blocked the non-compliant plan
        if: steps.scan.outcome != 'failure'
        run: echo "Gate should have failed on examples/plan.json" && exit 1
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: tfgate
